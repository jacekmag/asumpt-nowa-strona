  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Montserrat', sans-serif;
      color: #ffffff;
      background: #000000;
    }

    /* GŁÓWNY KONTENER EKRANU */
    .viewport-wrapper {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      background: #05070c;
    }

    /* WARSTWA ZDJĘCIA SKLEPU */
    .image-panel-wrapper {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2;

      -webkit-mask-image: radial-gradient(
        circle at center,
        rgba(0, 0, 0, 1) 30%,
        rgba(0, 0, 0, 0.8) 50%,
        rgba(0, 0, 0, 0.3) 70%,
        rgba(0, 0, 0, 0) 88%
      );
      mask-image: radial-gradient(
        circle at center,
        rgba(0, 0, 0, 1) 30%,
        rgba(0, 0, 0, 0.8) 50%,
        rgba(0, 0, 0, 0.3) 70%,
        rgba(0, 0, 0, 0) 88%
      );
    }

    .image-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .shop-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: 68.6% 57.1%;
      display: block;
      filter: contrast(1.05) brightness(0.95);
    }

    /* TELEFON W PIONIE (3.1): zdjęcie zajmowało tylko ~37% ekranu z object-fit:contain.
       Kadrowanie zamiast przemalowania — cover, wycentrowany na drzwiach (ten sam punkt,
       którego używa przycisk w 3.2), żeby drzwi wypełniały ekran. */
    @media (max-width: 640px) {
      .shop-image {
        object-fit: cover;
      }

      /* winieta maskowała złe miejsca obrazu przy cover na wąskim ekranie — wyłączona na telefonie */
      .image-panel-wrapper {
        -webkit-mask-image: none;
        mask-image: none;
      }
    }

    /* WARSTWA: JEDYNY RUCHOMY DYM (NA WIERZCHU) */
    .smoke-bg-front {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      z-index: 3;
      opacity: 0.45;
      mix-blend-mode: screen;
    }

    /* PLAKIETKA Z TREŚCIĄ DLA GOOGLE I UŻYTKOWNIKA — realny H1/adres/godziny,
       widoczne od razu, nie chowane trikiem CSS. Stojący w rogu, nie koliduje
       z klamką (środek) ani z age-gate (środek) ani z enter-prompt (dół). */
    .entry-sign {
      position: absolute;
      top: max(18px, env(safe-area-inset-top, 0px));
      left: 18px;
      z-index: 12;
      max-width: min(300px, 62vw);
      background: rgba(5, 7, 12, 0.55);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      padding: 12px 16px;
    }

    .entry-sign__eyebrow {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.62rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #ef4444;
      margin: 0 0 4px;
    }

    .entry-sign h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: #ffffff;
      margin: 0 0 6px;
    }

    .entry-sign p {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.68rem;
      line-height: 1.5;
      color: #cbd5e1;
      margin: 0;
    }

    @media (max-width: 640px) {
      .entry-sign {
        max-width: 56vw;
        padding: 9px 12px;
        top: max(12px, env(safe-area-inset-top, 0px));
        left: 12px;
      }
      .entry-sign h1 { font-size: 0.8rem; }
      .entry-sign p { font-size: 0.62rem; }
    }

    /* PANEL WERYFIKACJI WIEKU */
    .age-gate {
      position: absolute;
      z-index: 20;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 16px;
      padding: 35px 50px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 20px rgba(255, 255, 255, 0.1);
      transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      max-width: min(360px, 88vw);
    }

    .age-gate.hidden {
      opacity: 0;
      visibility: hidden;
      transform: scale(0.9);
      pointer-events: none;
    }

    .age-gate h2 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.4rem;
      color: #ffffff;
      letter-spacing: 2px;
      margin-bottom: 12px;
      text-transform: uppercase;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    .age-gate p {
      font-size: 0.95rem;
      color: #e2e8f0;
      margin-bottom: 26px;
      font-weight: 300;
    }

    .age-btn {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      border: none;
      color: #ffffff;
      padding: 14px 32px;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.3s ease;
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.4);
    }

    .age-btn:hover {
      background: linear-gradient(135deg, #34d399 0%, #10b981 100%);
      box-shadow: 0 0 30px rgba(16, 185, 129, 0.8);
      transform: translateY(-2px);
    }

    /* PANEL WERYFIKACJI WIEKU (3.4): na telefonie mniejszy, nie przeskalowany 1:1 z pulpitu */
    @media (max-width: 640px) {
      .age-gate {
        padding: 22px 26px;
        border-radius: 14px;
      }

      .age-gate h2 {
        font-size: 1.1rem;
        letter-spacing: 1.5px;
        margin-bottom: 9px;
      }

      .age-gate p {
        font-size: 0.82rem;
        margin-bottom: 18px;
      }

      .age-btn {
        padding: 11px 24px;
        font-size: 0.8rem;
      }
    }

    /* NAPIS NA DOLE */
    .enter-prompt {
      position: absolute;
      bottom: 4vh;
      z-index: 15;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 2px;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 12px 28px;
      border-radius: 30px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      opacity: 0;
      transition: opacity 1s ease-in-out;
      pointer-events: none;
      text-transform: uppercase;
    }

    .enter-prompt.visible {
      opacity: 1;
      animation: pulseGlow 2.5s infinite alternate;
    }

    /* NAPIS NA DOLE (4.2 / 4.3 / 4.4): na telefonie mniejsza czcionka, jedna linia,
       i pozycja liczona od realnie widocznego obszaru ekranu (dvh), nie od
       teoretycznej wysokości strony (vh) — inaczej pasek adresu przeglądarki
       chował napis pod dolną krawędzią widocznego ekranu. 18.08: podniesiony
       o kolejne ~10% wysokości ekranu (10dvh -> 20dvh, po korekcie 18.08 z 25dvh) — było zbyt
       nisko, teraz nachodzi częściowo na ciemny motyw drzwi, więc jest czytelniejszy.
       Zapasowa wartość w vh zostaje dla starszych przeglądarek bez wsparcia dvh. */
    @media (max-width: 640px) {
      .enter-prompt {
        bottom: 20vh;
        bottom: calc(20dvh + env(safe-area-inset-bottom, 0px));
        font-size: 0.72rem;
        letter-spacing: 1px;
        padding: 10px 20px;
        max-width: 90vw;
        white-space: nowrap;
      }
    }

    @keyframes pulseGlow {
      0% { border-color: rgba(239, 68, 68, 0.4); box-shadow: 0 0 15px rgba(239, 68, 68, 0.3); }
      100% { border-color: rgba(16, 185, 129, 0.6); box-shadow: 0 0 25px rgba(16, 185, 129, 0.5); }
    }

    /* PRZYCISK WEJŚCIA NA DRZWIACH Z EFEKTEM RADARU / SONARU
       Pozycja (top/left) jest teraz ustawiana w JS (patrz updateDoorPosition) — liczona
       względem widocznego, wyrenderowanego kadru zdjęcia (po uwzględnieniu object-fit
       i object-position), nie względem całego okna. Wartości poniżej to tylko punkt startowy
       przed pierwszym przeliczeniem, żeby uniknąć skoku w (0,0). */
    .door-trigger {
      position: absolute;
      top: 57.1%;
      left: 68.6%;
      width: 48px;
      height: 48px;
      margin-top: -24px;
      margin-left: -24px;
      z-index: 10;
      cursor: pointer;
      border-radius: 50%;
      border: 2px solid #ef4444;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(4px);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.8s ease, transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.3s ease;
    }

    .door-trigger svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.5;
      stroke-linecap: round;
      transition: stroke 0.3s ease;
    }

    /* AKTYWACJA PRZYCISKU PO WERYFIKACJI WIEKU */
    .door-trigger.active {
      opacity: 1;
      pointer-events: auto;
      animation: mainBtnPulse 2.4s infinite ease-in-out;
    }

    /* PIERŚCIENIE IMPULSÓW RADARU (SONAR) */
    .door-trigger.active::before,
    .door-trigger.active::after {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: 50%;
      border: 2px solid transparent;
      pointer-events: none;
      box-sizing: border-box;
    }

    /* IMPULS 1: CZERWONY (STAN DOMYŚLNY) */
    .door-trigger.active::before {
      animation: sonarPulseRed 2.4s infinite cubic-bezier(0.1, 0.7, 0.1, 1);
    }

    /* IMPULS 2: ZIELONY Z OPÓŹNIENIEM (STAN DOMYŚLNY) */
    .door-trigger.active::after {
      animation: sonarPulseGreen 2.4s infinite cubic-bezier(0.1, 0.7, 0.1, 1) 1.2s;
    }

    /* KLUCZOWE ANIMACJE RADARU - STAN BEZ HOVERA */
    @keyframes mainBtnPulse {
      0%, 100% {
        border-color: #ef4444;
        color: #ef4444;
        box-shadow: 0 0 15px rgba(239, 68, 68, 0.75), inset 0 0 8px rgba(239, 68, 68, 0.35);
      }
      50% {
        border-color: #10b981;
        color: #10b981;
        box-shadow: 0 0 22px rgba(16, 185, 129, 0.85), inset 0 0 10px rgba(16, 185, 129, 0.45);
      }
    }

    @keyframes sonarPulseRed {
      0% {
        transform: scale(1);
        opacity: 0.95;
        border-color: #ef4444;
        box-shadow: 0 0 12px rgba(239, 68, 68, 0.8);
      }
      100% {
        transform: scale(3.2);
        opacity: 0;
        border-color: #ef4444;
        box-shadow: 0 0 25px rgba(239, 68, 68, 0);
      }
    }

    @keyframes sonarPulseGreen {
      0% {
        transform: scale(1);
        opacity: 0.95;
        border-color: #10b981;
        box-shadow: 0 0 12px rgba(16, 185, 129, 0.8);
      }
      100% {
        transform: scale(3.2);
        opacity: 0;
        border-color: #10b981;
        box-shadow: 0 0 25px rgba(16, 185, 129, 0);
      }
    }

    /* STAN PO NAJECHANIU (HOVER) - POWIĘKSZENIE + TYLKO ZIELONE IMPULSY RADARU */
    .door-trigger.active:hover {
      transform: scale(1.4);
      background: rgba(16, 185, 129, 0.22);
      animation: mainBtnPulseHoverGreen 1.6s infinite ease-in-out;
    }

    .door-trigger.active:hover::before {
      animation: sonarPulseGreen 1.8s infinite cubic-bezier(0.1, 0.7, 0.1, 1);
    }

    .door-trigger.active:hover::after {
      animation: sonarPulseGreen 1.8s infinite cubic-bezier(0.1, 0.7, 0.1, 1) 0.9s;
    }

    @keyframes mainBtnPulseHoverGreen {
      0%, 100% {
        border-color: #10b981;
        color: #34d399;
        box-shadow: 0 0 25px rgba(16, 185, 129, 0.95), inset 0 0 12px rgba(16, 185, 129, 0.5);
      }
      50% {
        border-color: #34d399;
        color: #6ee7b7;
        box-shadow: 0 0 38px rgba(52, 211, 153, 1), inset 0 0 18px rgba(52, 211, 153, 0.7);
      }
    }
  </style>
</head>
<body>

  <div class="viewport-wrapper">
    <div class="entry-sign">
      <p class="entry-sign__eyebrow">Asumpt · Żoliborz · Warszawa</p>
      <h1>Vape Shop Asumpt, Pl. Wilsona 4</h1>
      <p>Tuż przy metrze Plac Wilsona. Pn–Pt 11:00–19:00, sob. 11:00–14:00, niedziela nieczynne.</p>
    </div>
    <div class="image-panel-wrapper">
      <div class="image-container">
        <img src="asumpt-witryna-zoliborz.png" alt="Witryna sklepu Asumpt Vape" class="shop-image" id="shopImage">

        <div class="door-trigger" id="doorTrigger" onclick="enterStore()">
          <svg viewBox="0 0 24 24">
            <path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path>
            <line x1="12" y1="2" x2="12" y2="12"></line>
          </svg>
        </div>
      </div>
    </div>

    <!-- JEDYNA WARSTWA DYMU: RUCHOMY WIDEO-DYM PRZEDNI
         Dwa źródła: telefon dostaje lżejszy plik (854px zamiast 1280px) — mniej danych
         do dekodowania na słabszym GPU. -->
    <video autoplay loop muted playsinline class="smoke-bg-front" id="smokeVideo">
      <source media="(max-width: 640px)" src="1-dym-telefon.mp4" type="video/mp4">
      <source src="1.mp4" type="video/mp4">
    </video>

    <div class="enter-prompt" id="enterPrompt">Naciśnij klamkę, żeby wejść</div>

    <div class="age-gate" id="ageGate">
      <h2>Weryfikacja Wieku</h2>
      <p>Strona przeznaczona wyłącznie dla osób pełnoletnich.</p>
      <button class="age-btn" onclick="verifyAge()">MAM UKOŃCZONE 18 LAT</button>
    </div>
  </div>

  <script>
    // Punkt na zdjęciu (asumpt-witryna-zoliborz.png), w którym leży klamka drzwi, jako ułamek WŁASNYCH
    // wymiarów obrazu (nie okna). Te same liczby co poprzednie top/left w CSS —
    // różnica jest w tym, względem czego są teraz liczone.
    // Skalibrowane 17.08 na telefonie Jacka (tryb kalibracji w podglądzie-artefakcie).
    const DOOR_X_FRAC = 0.686;
    const DOOR_Y_FRAC = 0.571;

    const shopImage = document.getElementById('shopImage');
    const doorTrigger = document.getElementById('doorTrigger');

    function updateDoorPosition() {
      if (!shopImage.naturalWidth || !shopImage.naturalHeight) return;

      const box = shopImage.getBoundingClientRect();
      const wrapper = shopImage.closest('.image-container').getBoundingClientRect();

      const fit = getComputedStyle(shopImage).objectFit;

      // Skala, w jakiej przeglądarka faktycznie renderuje obraz wewnątrz jego boksu,
      // zależna od object-fit: cover wypełnia bok krótszy, contain — dłuższy.
      const scale = (fit === 'cover')
        ? Math.max(box.width / shopImage.naturalWidth, box.height / shopImage.naturalHeight)
        : Math.min(box.width / shopImage.naturalWidth, box.height / shopImage.naturalHeight);

      const renderW = shopImage.naturalWidth * scale;
      const renderH = shopImage.naturalHeight * scale;

      // object-position (domyślnie "50% 50%", u nas "68.6% 57.1%") mówi, która część
      // nadmiaru/niedomiaru trafia na lewo/górę.
      const [posXraw, posYraw] = getComputedStyle(shopImage).objectPosition.split(' ');
      const posXfrac = parseFloat(posXraw) / 100 || 0.5;
      const posYfrac = parseFloat(posYraw) / 100 || 0.5;

      const offsetX = (box.width - renderW) * posXfrac;
      const offsetY = (box.height - renderH) * posYfrac;

      // Pozycja klamki w układzie współrzędnych kontenera obrazu (image-container),
      // nie całego okna — stąd odejmowanie wrapper.left/top.
      const doorX = (box.left - wrapper.left) + offsetX + DOOR_X_FRAC * renderW;
      const doorY = (box.top - wrapper.top) + offsetY + DOOR_Y_FRAC * renderH;

      doorTrigger.style.left = doorX + 'px';
      doorTrigger.style.top = doorY + 'px';
      doorTrigger.style.marginLeft = '-24px';
      doorTrigger.style.marginTop = '-24px';
    }

    let resizeTimer;
    function scheduleUpdate() {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(updateDoorPosition, 100);
    }

    if (shopImage.complete) {
      updateDoorPosition();
    } else {
      shopImage.addEventListener('load', updateDoorPosition);
    }
    window.addEventListener('resize', scheduleUpdate);
    window.addEventListener('orientationchange', scheduleUpdate);

    // Dym kosztuje GPU cały czas, niezależnie czy ktoś patrzy — nie dekodować
    // i nie kompozytować w tle, gdy karta/aplikacja jest schowana.
    const smokeVideo = document.getElementById('smokeVideo');
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        smokeVideo.pause();
      } else {
        smokeVideo.play().catch(() => {});
      }
    });

    function verifyAge() {
      document.getElementById('ageGate').classList.add('hidden');
      setTimeout(() => {
        updateDoorPosition();
        document.getElementById('enterPrompt').classList.add('visible');
        document.getElementById('doorTrigger').classList.add('active');
      }, 400);
    }

    // Przejście do strony 2 (przedsionek z płytkami). Ścieżka względna od tej
    // strony: 02-wnetrze-sklepu/ jest podfolderem katalogu, w którym leży
    // ten plik. (Do 18.08 był tu ../02-wnetrze-sklepu/ — poprawne w starym
    // układzie, gdzie strona 1 siedziała w osobnym 01-wejscie-strony/.)
    function enterStore() {
      document.body.style.transition = 'opacity 1s ease';
      document.body.style.opacity = '0';
      setTimeout(() => {
        window.location.href = '02-wnetrze-sklepu/index.html';
      }, 1000);
    }

    // Powrót „wstecz" ze strony 2 czasem przywraca tę stronę z bfcache
    // przeglądarki zamiast wczytać ją od nowa — a w zapamiętanym stanie
    // body wciąż ma opacity:0 z enterStore(), stąd czarny ekran. Przy
    // takim przywróceniu zdejmujemy zaciemnienie bez animacji fade-in.
    window.addEventListener('pageshow', function (e) {
      if (e.persisted) {
        document.body.style.transition = 'none';
        document.body.style.opacity = '1';
      }
    });
  </script>
</body>
</html>
