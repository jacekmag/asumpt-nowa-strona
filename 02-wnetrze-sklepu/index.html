      el.style.top=r.t+"%"; el.style.height=r.h+"%"; el.style.width=r.w+"%"; el.style.setProperty("--ro",r.o);
      ribs.appendChild(el);
    });
    stage.appendChild(ribs);
    var core=document.createElement("div"); core.className="core"; stage.appendChild(core);
    var brand=document.createElement("div"); brand.className="brandmark";
    brand.setAttribute("role","img"); brand.setAttribute("aria-label","Asumpt e-produkty");
    brand.style.setProperty("--logo",'url("../logo-asumpt.png")'); stage.appendChild(brand);
    /* Podpis firmy = jedyne wejscie do "O nas" (kategoria bez plytki).
       Dwie linie: "Poznaj nas" pulsujace (wezwanie do klikniecia),
       fakt firmowy pod spodem, ciszej. */
    var podpis=document.createElement("a"); podpis.className="founded"; podpis.href="o-nas.html";
    var cta=document.createElement("span"); cta.className="cta"; cta.textContent="Poznaj nas →";
    var sub=document.createElement("span"); sub.className="sub"; sub.textContent="Działamy od 1990 r.";
    podpis.appendChild(cta); podpis.appendChild(sub); stage.appendChild(podpis);
    stage.appendChild(tpl.content.cloneNode(true));
    scenes.push({stage:stage, field:stage.querySelector("[data-field]"), ring:stage.querySelector("[data-ring]"),
                 cells:Array.prototype.slice.call(stage.querySelectorAll(".cell")), angle:0, target:0, raf:0, dragging:false, lastX:0, flipAt:90});
  });

  function geom(sc){
    var w=sc.stage.clientWidth; if(!w){return;}
    var narrow=w<640, pw=narrow?w*.72:w*.30, r=narrow?w*.62:w*.42;
    sc.cells.forEach(function(c){ c.style.setProperty("--pw",pw.toFixed(0)+"px"); c.style.setProperty("--radius",r.toFixed(0)+"px"); });
    /* Kat, przy ktorym plytka stoi kantem do kamery: cos(kat) = promien / perspektywa.
       Nie 90 stopni — perspektywa przesuwa ten moment. Tu przelaczamy tyl plytki, wiec zmiana jest niewidoczna. */
    var P=parseFloat(getComputedStyle(sc.field).perspective)||1100;
    sc.flipAt=Math.acos(Math.min(1,r/P))*180/Math.PI;
  }
  function depth(sc){
    sc.cells.forEach(function(c){
      var a=((parseFloat(c.style.getPropertyValue("--a"))+sc.angle)%360+360)%360;
      var dn=Math.min(a,360-a)/180;
      /* mocniejsze przygaszenie i rozmycie w glebi - napis tylnej plytki ma
         zostac czytelny jako detal, nie konkurowac z przednim */
      c.querySelector(".plate").style.filter="brightness("+(1-dn*.62).toFixed(2)+") blur("+(dn*3.6).toFixed(2)+"px)";
      c.style.zIndex=String(100-Math.round(dn*100));
      c.classList.toggle("is-front",dn<.12);
      c.classList.toggle("is-back",a>sc.flipAt&&a<360-sc.flipAt);
    });
  }
  function tick(sc){
    var d=sc.target-sc.angle;
    if(Math.abs(d)<.02){ sc.angle=sc.target; sc.raf=0; sc.ring.style.setProperty("--ring",sc.angle.toFixed(2)); depth(sc); return; }
    sc.angle+=d*.12; sc.ring.style.setProperty("--ring",sc.angle.toFixed(2)); depth(sc);
    sc.raf=requestAnimationFrame(function(){tick(sc);});
  }
  function snap(sc){ sc.target=Math.round(sc.target/60)*60; if(!sc.raf){ sc.raf=requestAnimationFrame(function(){tick(sc);}); } }

  scenes.forEach(function(sc){
    sc.field.addEventListener("pointerdown",function(e){ sc.dragging=true; sc.lastX=e.clientX; sc.field.classList.add("dragging"); sc.field.setPointerCapture(e.pointerId); });
    sc.field.addEventListener("pointermove",function(e){
      if(!sc.dragging){return;}
      var dx=e.clientX-sc.lastX; sc.lastX=e.clientX;
      sc.target+=dx*.32; sc.angle+=dx*.32;
      sc.ring.style.setProperty("--ring",sc.angle.toFixed(2)); depth(sc);
    });
    var end=function(){ if(sc.dragging){ sc.dragging=false; sc.field.classList.remove("dragging"); snap(sc); } };
    sc.field.addEventListener("pointerup",end); sc.field.addEventListener("pointercancel",end);
  });

  function shuffle(sc){
    var tempo=parseFloat(sc.stage.style.getPropertyValue("--tempo"))||0;
    sc.cells.forEach(function(c,n){
      var p=c.querySelector(".plate");
      p.style.setProperty("--igdel",(.35+n*(.2+tempo*.6)+rnd(-.06,.14)).toFixed(2)+"s");
      p.style.setProperty("--igdur",(.8+tempo*2+rnd(-.15,.3)).toFixed(2)+"s");
      c.querySelectorAll(".sonar").forEach(function(s){ s.style.setProperty("--sdel",(n*.34).toFixed(2)+"s"); });
    });
  }
  function play(){
    scenes.forEach(function(sc){ sc.stage.classList.remove("lit"); shuffle(sc); void sc.stage.offsetWidth;
      setTimeout(function(){ sc.stage.classList.add("lit"); },380); });
  }
  if("ResizeObserver" in window){
    var ro=new ResizeObserver(function(){ scenes.forEach(function(sc){ geom(sc); depth(sc); }); });
    scenes.forEach(function(sc){ ro.observe(sc.stage); });
  }
  var tries=0;
  (function settle(){ scenes.forEach(function(sc){ geom(sc); depth(sc); });
    if(!scenes[0].stage.clientWidth && tries++<90){ requestAnimationFrame(settle); } })();
  window.addEventListener("load",function(){ scenes.forEach(function(sc){ geom(sc); depth(sc); }); });
  play();
})();
</script>

<!-- PODGLAD NA TELEFON - sama scena, bez panelu roboczego.
     Te reguly stały TUTAJ i przez to dzialaly ZA POZNO: dzielilo je od
     znacznika panelu 230 000 bajtow (tlo i logo wpisane w plik jako
     data URI), wiec przegladarka zdazyla pokazac suwaki i naglowek na
     ulamek sekundy przed zaplonem. Przeniesione do <style> w naglowku
     pliku, zaraz za regula "code". Tutaj nie zostawiamy kopii, zeby
     nie bylo dwoch miejsc do zmieniania. -->


<style>
/* ============================================================
   POPRAWKA KADRU I GLEBI - wersja 3, 17.08.2026

   Wersja 1 naprawila kadr (mieszczenie sie w oknie, podpis widoczny),
   ale regula perspektywy nie trafila w element - w pliku produkcyjnym
   panel z suwakami jest zdjety, wiec klasa "mode-ring" nie istnieje.
   Perspektywe ustawia wiec skrypt ponizej, ktory znajduje wlasciwy
   element sam i odczytuje prawdziwe wymiary sceny.

   Wersja 2 regulowala wielkosc jedna liczba dla kazdej szerokosci okna
   i przez to dusila scene na telefonie do 30% kadru.

   Wersja 3 rozdziela pulpit od telefonu - patrz komentarz przy UDZIAL_TEL.
   ============================================================ */

html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: #04060a;
}

/* Kadr: wysrodkowany, wpisany w okno. 177.7vh = 16/9 wysokosci okna,
   wiec przy niskim i szerokim oknie o rozmiarze decyduje wysokosc. */
.stage {
  position: fixed !important;
  inset: 0 !important;
  margin: auto !important;
  width: min(100vw, 177.7vh) !important;
  max-width: none !important;
}
</style>

<script>
/* ============================================================
   GLEBIA PIERSCIENIA - samoregulacja

   Problem: promien pierscienia rosnie razem z szerokoscia kadru
   (radius = mnoznik * szerokosc), ale perspektywa jest wpisana
   na sztywno. Im szerszy ekran, tym mocniej przednia plytka jest
   przysunieta do kamery - az wypelnia caly ekran i pierscien
   przestaje byc czytelny jako bryla.

   Zmierzone przed poprawka: przy oknie 2000x950 przednia plytka
   miala 2538 px przy kadrze 2000 px, czyli 127% szerokosci kadru.

   Rozwiazanie: nie zgadujemy zadnych liczb. Skrypt odczytuje ze sceny
   rzeczywista szerokosc plytki (--pw) i promien pierscienia (--radius)
   i rozdziela sterowanie na dwie osobne rzeczy:

     GLEBIA  -> perspektywa. Ile przednia plytka jest wieksza od bocznych.
     UDZIAL  -> jednolite odsuniecie calego pierscienia. Jak duzy jest
                pierscien na ekranie.

   Rozdzielenie jest konieczne, bo sama perspektywa NIE potrafi zmniejszyc
   przedniej plytki ponizej jej wlasnej szerokosci z ukladu - przednia
   plytka jest najblizej kamery, wiec zawsze jest powiekszana, nigdy
   pomniejszana. Probowanie zejscia nizej sama perspektywa konczy sie
   splaszczeniem sceny do zera glebi.

   Powiekszenie przedniej plytki = P / (P - promien) = g
   Stad:   P = promien * g / (g - 1)
   Skala:  k = UDZIAL * szerokosc_kadru / (szerokosc_plytki * g)

   Przelicza sie przy kazdej zmianie rozmiaru okna.
   ============================================================ */
(function () {
  "use strict";

  /* Wielkosc pierscienia na PULPICIE. 0.30 = przednia plytka zajmuje 30%
     szerokosci kadru. Mniej = pierscien cofniety glebiej.
     Zatwierdzone przez Jacka 17.08: "Jest idealnie". Nie ruszac. */
  var UDZIAL = 0.30;

  /* Wielkosc pierscienia na TELEFONIE - osobna liczba, bo telefon ma
     zupelnie inne warunki: kadr jest waski i pionowy (3/4 zamiast 16/9),
     a uklad sceny sam z siebie daje tam plytce 72% szerokosci zamiast 30%.

     Jedna wspolna liczba dla obu przypadkow nie ma sensu:
       - 0.30 dusilo scene na telefonie do 113 px przednia plytke,
       - stan sprzed poprawki (0.91) rozpychal przednia plytke od krawedzi
         do krawedzi i z bocznych plytek zostawaly slupki po 17 px - nie
         bylo widac, ze cokolwiek jest z boku i ze pierscien ma sie
         z czego obracac.

     ZMIERZONE w Chromium przy kadrze 375 x 500 (okno 375 x 812):

       UDZIAL_TEL   przednia plytka   z bocznej widac   zapas do krawedzi
       ----------   ---------------   ---------------   -----------------
          0.50        187 x  99 px         54 px              40 px
          0.56        210 x 111 px         60 px              22 px
       -> 0.60        225 x 118 px         64 px              11 px   <- ustawione
          0.62        232 x 122 px         66 px               5 px   (maksimum)
          0.68        255 x 134 px         60 px             -13 px   (bok przyciety)
          0.91        341 x 180 px         17 px             -66 px   (stan sprzed poprawki)

     Widocznosc bocznej plytki rosnie tylko do ~0.62 i potem MALEJE, bo
     boki zaczynaja uciekac poza kadr i sa przycinane jego krawedzia.
     0.60 stoi tuz pod tym szczytem - boczne plytki sa najszersze, jakie
     moga byc, i caly pierscien nadal miesci sie w kadrze z zapasem.

     ZATWIERDZONE przez Jacka 17.08: "Te 60% jest idealne". Nie ruszac. */
  var UDZIAL_TEL = 0.60;

  /* WYSOKOSC KADRU NA TELEFONIE - proporcja szerokosc/wysokosc.
     0.75 = 3/4, czyli stan zastany. 0 = kadr na caly ekran.

     Skad sie biora czarne pasy: kadr ma sztywna proporcje 3/4, a telefon
     jest znacznie wyzszy (375 x 812 to proporcja 0.46). Kadr wychodzi
     375 x 500 i jest wysrodkowany, wiec zostaje po 156 px czerni u gory
     i u dolu - 38% ekranu.

     Nie da sie tego zabrac za darmo. Tlo (1400 x 788) jest wpasowane
     przez "cover", wiec im wyzszy kadr, tym wezszy wycinek pejzazu widac:

       kadr           wysokosc   czarny pas   z pejzazu widac wszerz
       ------------   --------   ----------   ----------------------
       0.75 (3/4)     500 px     156 px       42%   (stan zastany)
       0.60 (3/5)     625 px      94 px       34%
       0.50 (1/2)     750 px      31 px       28%
       0    (pelny)   812 px       0 px       26%   <- ustawione

     Czyli: mniej czerni = ciasniejszy wycinek gor i drogi. Do obejrzenia
     obok siebie: PROBA-KADR.html.

     WYBRANE przez Jacka 18.08: pelny ekran. Uzasadnienie warte zapisania,
     bo dotyczy nie tylko tej jednej liczby:
       "Tu ten pelny pejzaz nie ma takiego znaczenia jak na szerokim
        ekranie. I tak nikt tego nie zauwazy, a te ciemne puste pasy
        od razu widac."
     Czyli: na telefonie wygrywa brak pustki, nie kompletnosc tla.
     Tlo jest atmosfera, nie trescia - ta sama zasada, co "tlo nie moze
     wygrywac z trescia" z etapu wybierania sceny.

     Pulpitu to NIE dotyczy - dziala tylko ponizej PROG_TEL. */
  var KADR_TEL = 0;

  /* Prog telefonu. 640 px to ten sam prog, ktorego uzywa sama scena
     (@media max-width:640px oraz narrow = w < 640 w jej skrypcie).
     Musi byc ten sam, inaczej ponizej progu liczylibysmy skale
     do jednego ukladu, a scena rysowalaby drugi. */
  var PROG_TEL = 640;

  /* Powiekszenie przedniej plytki wzgledem bocznych, czyli sila perspektywy
     NA PULPICIE. 1.45 jest blisko stanu zatwierdzonego (promien 325 px przy
     perspektywie 1100 px daje 1.42). Wieksze = mocniejsza glebia. Tego nie
     ruszamy przy regulacji wielkosci - od wielkosci jest UDZIAL. */
  var GLEBIA = 1.45;

  /* Podglad wariantow telefonu: index.html?u=0.56 nadpisuje UDZIAL_TEL.
     Sluzy wylacznie do porownywania ustawien obok siebie - patrz
     PROBA-TELEFON.html. Bez parametru nic sie nie zmienia. */
  var zAdresu = parseFloat((String(location.search).match(/[?&]u=([0-9.]+)/) || [])[1]);
  if (isFinite(zAdresu) && zAdresu >= 0.2 && zAdresu <= 1.2) { UDZIAL_TEL = zAdresu; }

  /* To samo dla wysokosci kadru: index.html?k=0.5 albo ?k=0 (pelny ekran).
     Do porownywania wariantow - patrz PROBA-KADR.html. */
  var kAdresu = parseFloat((String(location.search).match(/[?&]k=([0-9.]+)/) || [])[1]);
  if (isFinite(kAdresu) && (kAdresu === 0 || (kAdresu >= 0.3 && kAdresu <= 1.2))) { KADR_TEL = kAdresu; }

  function popraw() {
    var stage = document.querySelector(".stage");
    if (!stage) { return false; }

    var cell = stage.querySelector(".cell");
    if (!cell) { return false; }

    var W = stage.clientWidth;
    if (!W) { return false; }

    var cs = window.getComputedStyle(cell);
    var pw = parseFloat(cs.getPropertyValue("--pw"));
    var promien = parseFloat(cs.getPropertyValue("--radius"));

    /* Uklad siatki zamiast pierscienia - nie ma czego poprawiac. */
    if (!pw || !promien) { return false; }

    /* Znajdz element, ktory naprawde trzyma perspektywe - idac w gore
       od plytki. Dzieki temu nie zalezymy od nazw klas. */
    var host = cell.parentElement;
    while (host && host !== stage &&
           window.getComputedStyle(host).perspective === "none") {
      host = host.parentElement;
    }

    /* Nic nie ma perspektywy (np. zostala zdjeta) - ustaw na rodzicu
       pierscienia, czyli tam, gdzie byla pierwotnie. */
    if (!host || host === stage) {
      host = cell.parentElement ? cell.parentElement.parentElement : null;
    }
    if (!host) { return false; }

    var naTelefonie = W < PROG_TEL;

    /* Wysokosc kadru na telefonie. Porownanie z tym, co juz stoi w stylu,
       jest konieczne: zmiana kadru zmienia rozmiar sceny, a rozmiar sceny
       budzi ResizeObserver, ktory wola te funkcje jeszcze raz. Bez tego
       porownania byloby to bez konca. */
    if (naTelefonie) {
      var chcemy = (KADR_TEL > 0) ? String(KADR_TEL) : "auto";
      if (stage.style.getPropertyValue("aspect-ratio") !== chcemy) {
        stage.style.setProperty("aspect-ratio", chcemy, "important");
        /* Przy kadrze na caly ekran nie ma proporcji, ktora policzylaby
           wysokosc - a dzieci sceny sa pozycjonowane bezwzglednie, wiec
           z zawartosci wyszloby zero. Wysokosc trzeba podac wprost.

           Najpierw 100%, potem 100dvh. dvh to "dynamiczna wysokosc okna",
           czyli realnie widoczny obszar na telefonie - bez niej podpis
           "Firma zalozona w 1990 r." (4,4% od dolu kadru) moglby wpasc
           pod pasek adresu przegladarki. Stare przegladarki nie znaja
           dvh i po prostu zignoruja to przypisanie, zostajac przy 100%. */
        if (KADR_TEL > 0) { stage.style.removeProperty("height"); }
        else {
          stage.style.setProperty("height", "100%", "important");
          stage.style.setProperty("height", "100dvh", "important");
        }
      }
    } else if (stage.style.getPropertyValue("aspect-ratio")) {
      stage.style.removeProperty("aspect-ratio");
      stage.style.removeProperty("height");
    }

    var g;   /* o ile perspektywa powieksza przednia plytke */

    if (naTelefonie) {
      /* TELEFON - glebi NIE ruszamy.
         Uklad telefonu byl zatwierdzony ze swoja wlasna perspektywa
         z arkusza (1100 px, co przy promieniu 233 px daje g = 1.269).
         Zdejmujemy nasza - zeby po zwezeniu okna z pulpitu wrocila ta
         wlasciwa - i dopiero wtedy ja odczytujemy.
         Na telefonie reguluje sie wylacznie wielkosc. */
      host.style.removeProperty("perspective");
      var Pt = parseFloat(window.getComputedStyle(host).perspective);
      if (!Pt || Pt <= promien) { return false; }
      g = Pt / (Pt - promien);
    } else {
      /* PULPIT - perspektywa ustala sile glebi, nie wielkosc.
         P = promien * g / (g - 1) daje powiekszenie przedniej plytki = g. */
      g = GLEBIA;
      host.style.setProperty("perspective",
        (promien * g / (g - 1)).toFixed(0) + "px", "important");
    }

    /* Wielkosc zalatwia jednolite odsuniecie calego pierscienia.
       Sama perspektywa nie potrafi zejsc ponizej wlasnej szerokosci
       plytki (przednia plytka jest najblizej kamery, wiec zawsze jest
       powiekszana). Skala na kontenerze dziala jak cofniecie kamery:
       zmniejsza wszystko rownomiernie i zachowuje proporcje glebi. */
    var k = ((naTelefonie ? UDZIAL_TEL : UDZIAL) * W) / (pw * g);
    if (!isFinite(k) || k <= 0) { return false; }
    if (k > 1.5) { k = 1.5; }

    /* Skala idzie na ten sam element. Jest nakladana PO rzucie
       perspektywicznym dzieci, wiec nie psuje bryly - dziala dokladnie
       jak odsuniecie kamery. */
    host.style.setProperty("transform", "scale(" + k.toFixed(4) + ")", "important");
    host.style.setProperty("transform-origin", "50% 50%", "important");
    return true;
  }

  /* Scena ustawia --pw i --radius dopiero, gdy policzy swoja geometrie,
     wiec probujemy do skutku przez chwile po starcie. */
  var proby = 0;
  (function czekaj() {
    if (!popraw() && proby++ < 180) {
      window.requestAnimationFrame(czekaj);
    }
  })();

  window.addEventListener("load", popraw);

  /* Przy zmianie rozmiaru okna scena przelicza --pw i --radius,
     wiec perspektywa musi isc za nimi. */
  if ("ResizeObserver" in window) {
    var st = document.querySelector(".stage");
    if (st) { new ResizeObserver(popraw).observe(st); }
  } else {
    window.addEventListener("resize", popraw);
  }
})();
</script>

<style>
/* ============================================================
   KLIKNIECIE PLYTKI - warstwa wygladu
   Dopisywane na koniec index.html przez POPRAW-PULPIT-2.bat.
   Nie rusza zatwierdzonego wygladu sceny - dodaje wylacznie to,
   co jest potrzebne, zeby plytka czytala sie jako klikalna.
   ============================================================ */

/* Kursor. Pierscien nadal mozna przeciagac, wiec w trakcie
   przeciagania wraca lapka - inaczej "rekawica" gubi sie pod strzalka. */
.cell { cursor: pointer }
.field.dragging .cell { cursor: grabbing }

/* Delikatne podswietlenie krawedzi przedniej plytki pod kursorem.
   Tylko tam, gdzie jest prawdziwy kursor - telefon to pomija.
   Ruszamy wylacznie poswiata krawedzi (box-shadow), nie kolorem
   ani wypelnieniem - zeby nie ruszac zatwierdzonego wygladu. */
@media (hover: hover) {
  .cell.is-front .plate::before { transition: box-shadow .18s ease }
  .cell.is-front:hover .plate::before {
    box-shadow: 0 0 26px -1px var(--tint), inset 0 0 22px -6px var(--tint);
  }
}

/* Obwodka przy sterowaniu klawiatura. Mysz jej nie pokazuje. */
.cell:focus { outline: none }
.cell:focus-visible .plate {
  outline: 2px solid var(--tint);
  outline-offset: 4px;
}
.cell:focus-visible .plate::before {
  box-shadow: 0 0 26px -1px var(--tint), inset 0 0 22px -6px var(--tint);
}

/* POWROT Z PODSTRONY - bez zaplonu.
   Zaplon jarzeniowki to wejscie do sklepu i ma sie zdarzyc RAZ, na starcie.
   Przy powrocie z kategorii scena ma juz stac zapalona - odgrywanie calej
   sekwencji od nowa (ok. 3,8 s) przy kazdym cofnieciu meczy.

   Gasimy tylko cztery animacje wejscia i dopisujemy ich stan koncowy.
   Klasa "lit" ZOSTAJE, wiec radar na przedniej plytce dziala dalej -
   to jedyny ruch, ktory w tej scenie jest ciagly i byl zatwierdzony. */
.stage.bez-zaplonu::after   { animation: none !important; opacity: 0 !important }
.stage.bez-zaplonu .plate     { animation: none !important; opacity: 1 !important }
.stage.bez-zaplonu .brandmark { animation: none !important; opacity: 1 !important }
.stage.bez-zaplonu .founded   { animation: none !important; opacity: 1 !important }

/* Kurtyna wejscia w kategorie. Ten sam pomysl, co klamka na stronie 1:
   kadr gasnie do czerni, dopiero potem zmienia sie adres. Podstrona
   startuje z czerni, wiec szwu nie widac.
   CZAS w skrypcie ponizej musi byc rowny temu przejsciu. */
.kurtyna {
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: #04060a;
  opacity: 0;
  pointer-events: none;
  transition: opacity .65s ease;
}
.kurtyna.gra { opacity: 1; pointer-events: auto }
</style>

<script>
/* ============================================================
   KLIKNIECIE PLYTKI -> PODSTRONA KATEGORII

   Trzy rzeczy do zalatwienia:

   1. Odroznic klikniecie od przeciagania. Pierscien obraca sie
      przeciaganiem, wiec kazde puszczenie palca po ruchu byloby
      falszywym klikiem. Kryterium: ruch ponizej PROG pikseli
      i krocej niz CZAS_TAPU.

   2. Klikniecie bocznej plytki NIE wchodzi na podstrone, tylko
      dokreca pierscien tak, zeby ta plytka stanela z przodu.
      Boczne plytki sa przygaszone, rozmyte i waskie - wejscie
      prosto z nich to prosta droga do pomylki. Wchodzi dopiero
      klikniecie plytki stojacej z przodu.

   3. Dokrecanie pierscienia przez ODEGRANIE PRZECIAGNIECIA.
      Scena trzyma swoj kat w prywatnej zmiennej wewnatrz wlasnej
      funkcji - z zewnatrz nie da sie go ustawic. Gdybysmy pisali
      wprost po --ring, stan sceny zostalby w tyle i pierwsze
      prawdziwe przeciagniecie szarpnieloby pierscien z powrotem.
      Dlatego wysylamy te same zdarzenia pointer, ktore wysyla
      palec. Scena sama liczy wtedy glebie, przygaszenie plytek
      i klase is-front - nic nie trzeba duplikowac ani zgadywac.
   ============================================================ */
(function () {
  "use strict";

  /* Ktora plytka dokad prowadzi. Kluczem jest kat plytki na pierscieniu
     (--a w znaczniku .cell), nie kolejnosc w kodzie - przestawienie
     plytek w szablonie niczego tu nie zepsuje. */
  var STRONY = {
    "0":   "dobor-sprzetu.html",
    "60":  "zestawy.html",
    "120": "liquidy.html",
    "180": "sole.html",
    "240": "czesci-akcesoria.html",
    "300": "kontakt.html"
  };

  var PROG = 8;            /* px  - powyzej tego ruch to przeciaganie, nie klikniecie */
  var CZAS_TAPU = 700;     /* ms  - dluzsze przytrzymanie to juz nie klikniecie */
  var CZAS_OBROTU = 420;   /* ms  - dokrecenie pierscienia po kliknieciu bocznej plytki */
  var CZAS_KURTYNY = 650;  /* ms  - MUSI byc rowne transition .kurtyna w stylu wyzej */
  var CZULOSC = 0.32;      /* stopni na piksel przeciagniecia - wartosc z kodu sceny */

  var scena = document.querySelector(".stage");
  if (!scena) { return; }
  var pole = scena.querySelector(".field");
  var pierscien = scena.querySelector(".ring");
  if (!pole || !pierscien) { return; }
  var plytki = Array.prototype.slice.call(scena.querySelectorAll(".cell"));
  if (!plytki.length) { return; }

  var bezRuchu = window.matchMedia &&
                 window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* --- Powrot z podstrony ------------------------------------------------
     Znacznik stawiamy w chwili wejscia w kategorie i zdejmujemy przy
     powrocie. Dzieki temu zaplon pomijamy WYLACZNIE przy cofnieciu:
     wejscie ze strony 1 gra pelna sekwencje, odswiezenie strony tez.

     sessionStorage zyje tyle, co karta przegladarki - zamkniecie karty
     kasuje znacznik, wiec nastepna wizyta znowu zaczyna sie od zaplonu.

     Owiniete w try, bo przy pliku otwartym z dysku (file://) przegladarka
     potrafi odmowic dostepu do magazynu. Wtedy po prostu gra zaplon. */
  var KLUCZ = "asumpt-wraca-z-kategorii";

  function zapamietajWyjscie() {
    try { window.sessionStorage.setItem(KLUCZ, "1"); } catch (blad) { /* brak magazynu */ }
  }
  function czyPowrot() {
    try {
      if (window.sessionStorage.getItem(KLUCZ)) {
        window.sessionStorage.removeItem(KLUCZ);
        return true;
      }
    } catch (blad) { /* brak magazynu */ }
    return false;
  }

  /* --- Dostepnosc -------------------------------------------------------
     Plytka to div, wiec sama z siebie nie jest ani klikalna klawiatura,
     ani czytana jako odnosnik. Nazwe bierzemy z jej wlasnego napisu,
     zeby nie powtarzac tekstu w dwoch miejscach. */
  plytki.forEach(function (p) {
    var napis = p.querySelector(".p-name");
    p.setAttribute("role", "link");
    p.setAttribute("tabindex", "0");
    if (napis) { p.setAttribute("aria-label", napis.textContent.trim()); }
  });

  /* --- Kurtyna ---------------------------------------------------------- */
  var kurtyna = document.createElement("div");
  kurtyna.className = "kurtyna";
  document.body.appendChild(kurtyna);

  /* Wracamy z kategorii - scena ma juz stac zapalona, bez odgrywania
     zaplonu od nowa. Zdazamy przed scena: ona doklada klase "lit"
     dopiero po 380 ms, a to jest zwykly styl, nie kolejnosc zdarzen. */
  if (czyPowrot()) { scena.classList.add("bez-zaplonu"); }

  /* Przycisk "wstecz" potrafi przywrocic strone z pamieci przegladarki
     bez uruchamiania skryptow - scena jest wtedy dokladnie taka, jaka
     byla, i nie ma czego pomijac. Trzeba tylko zdjac znacznik, zeby nie
     zostal na pozniej i nie zjadl zaplonu przy nastepnym prawdziwym
     wejsciu.

     18.08: samo zdjecie znacznika nie wystarczalo. "Dokladnie taka, jaka
     byla" znaczy TEZ: z zapalona kurtyna i z wchodzimy=true, bo tak
     wygladala scena w chwili wyjscia w kategorie. Przy cofnieciu z
     podstrony wracal wiec czarny ekran zamiast karuzeli, a pod nim
     martwe plytki - kurtyna lapie klikniecia (pointer-events:auto),
     a wejdz() i tak odbijalo sie od wchodzimy. Dlatego gasimy kurtyne
     i odblokowujemy wejscie. */
  window.addEventListener("pageshow", function (e) {
    if (!e.persisted) { return; }
    czyPowrot();
    kurtyna.classList.remove("gra");
    wchodzimy = false;
  });

  var wchodzimy = false;
  function wejdz(adres) {
    if (wchodzimy) { return; }
    wchodzimy = true;
    zapamietajWyjscie();
    if (bezRuchu) { window.location.href = adres; return; }
    kurtyna.classList.add("gra");
    setTimeout(function () { window.location.href = adres; }, CZAS_KURTYNY);
  }

  /* --- Katy ------------------------------------------------------------- */
  function katPlytki(p) { return parseFloat(p.style.getPropertyValue("--a")) || 0; }
  function katPierscienia() { return parseFloat(pierscien.style.getPropertyValue("--ring")) || 0; }

  /* Plytka stoi z przodu, gdy jej kat wlasny plus kat pierscienia
     daje zero. Stad ile stopni brakuje: */
  function ileDoPrzodu(p) { return -(katPlytki(p) + katPierscienia()); }

  /* --- Odegranie przeciagniecia ----------------------------------------- */
  var obracamy = false;
  var przerwane = false;

  /* Prawdziwe dotkniecie w trakcie dokrecania przerywa je natychmiast -
     od tej chwili pierscieniem steruje palec, a nasze dalsze zdarzenia
     liczylyby sie od nieaktualnego punktu i szarpnelyby scena. */
  pole.addEventListener("pointerdown", function (e) {
    if (e.isTrusted && obracamy) { przerwane = true; }
  }, true);

  function zdarzenie(typ, x, y) {
    return new PointerEvent(typ, {
      bubbles: true, cancelable: true, composed: true,
      clientX: x, clientY: y,
      pointerId: 1, pointerType: "mouse", isPrimary: true,
      button: 0, buttons: (typ === "pointerup" ? 0 : 1)
    });
  }

  function dokrec(stopnie) {
    /* Najkrotsza droga: -180 do 180 stopni. */
    stopnie = ((stopnie + 180) % 360 + 360) % 360 - 180;
    if (Math.abs(stopnie) < 0.5) { return; }

    var ramka = pole.getBoundingClientRect();
    var x0 = ramka.left + ramka.width / 2;
    var y0 = ramka.top + ramka.height / 2;
    var pikseli = stopnie / CZULOSC;

    /* setPointerCapture odrzuca wskaznik, ktorego naprawde nie ma.
       Na czas odegrania podmieniamy metode na taka, ktora ten jeden
       blad przelyka; prawdziwe wskazniki dziala jak dotad. Wlasnosc
       siedzi na samym elemencie, wiec delete przywraca oryginal. */
    var oryginalna = pole.setPointerCapture;
    pole.setPointerCapture = function (id) {
      try { return oryginalna.call(pole, id); } catch (blad) { /* wskaznik odegrany */ }
    };

    obracamy = true;
    przerwane = false;
    var start = 0;

    pole.dispatchEvent(zdarzenie("pointerdown", x0, y0));

    function koniec() {
      delete pole.setPointerCapture;
      obracamy = false;
    }

    function klatka(teraz) {
      if (przerwane) { koniec(); return; }
      if (!start) { start = teraz; }
      var t = (CZAS_OBROTU > 0 && !bezRuchu)
                ? Math.min(1, (teraz - start) / CZAS_OBROTU)
                : 1;
      var e = 1 - Math.pow(1 - t, 3);   /* wyhamowanie na koncu */
      pole.dispatchEvent(zdarzenie("pointermove", x0 + pikseli * e, y0));
      if (t < 1) {
        requestAnimationFrame(klatka);
      } else {
        pole.dispatchEvent(zdarzenie("pointerup", x0 + pikseli, y0));
        koniec();
      }
    }
    requestAnimationFrame(klatka);
  }

  /* --- Uruchomienie plytki ---------------------------------------------- */
  function uruchom(p) {
    if (wchodzimy || obracamy) { return; }
    if (p.classList.contains("is-front")) {
      var adres = STRONY[String(katPlytki(p))];
      if (adres) { wejdz(adres); }
      return;
    }
    dokrec(ileDoPrzodu(p));
  }

  /* --- Odroznienie klikniecia od przeciagania ---------------------------- */
  var startX = 0, startY = 0, startCzas = 0, byRuch = false, dotknieta = null;

  /* Faza przechwytywania, bo scena przejmuje wskaznik (setPointerCapture)
     i od tej chwili zdarzenia trafiaja w cala scene, nie w plytke.
     Ktora plytka zostala dotknieta, wiadomo tylko na samym poczatku. */
  pole.addEventListener("pointerdown", function (e) {
    if (!e.isTrusted) { return; }
    startX = e.clientX; startY = e.clientY;
    startCzas = Date.now();
    byRuch = false;
    dotknieta = (e.target && e.target.closest) ? e.target.closest(".cell") : null;
  }, true);

  pole.addEventListener("pointermove", function (e) {
    if (!e.isTrusted || !dotknieta) { return; }
    if (Math.abs(e.clientX - startX) > PROG || Math.abs(e.clientY - startY) > PROG) {
      byRuch = true;
    }
  }, true);

  pole.addEventListener("pointerup", function (e) {
    if (!e.isTrusted) { return; }
    var p = dotknieta;
    dotknieta = null;
    if (!p || byRuch) { return; }
    if (Date.now() - startCzas > CZAS_TAPU) { return; }

    /* Odlozone o jedna kolejke zdarzen. Scena konczy przeciaganie
       dopiero w swojej obsludze pointerup, ktora idzie PO tej.
       Gdybysmy dokrecali tutaj, jej "koniec przeciagania" wypadlby
       w srodku naszego odegrania i zatrzymal je na starcie. */
    setTimeout(function () { uruchom(p); }, 0);
  }, true);

  pole.addEventListener("pointercancel", function () { dotknieta = null; }, true);

  /* --- Klawiatura -------------------------------------------------------- */
  plytki.forEach(function (p) {
    p.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " " || e.key === "Spacebar") {
        e.preventDefault();
        uruchom(p);
      }
    });
  });
})();
</script>
