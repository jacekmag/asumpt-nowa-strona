:root{
  --ground:#101418; --ground-2:#0a0d10; --plate:#171D23;
  --line:#28323A; --line-soft:#202830;
  --ink:#F2F4F5; --ink-2:#AEBAC1; --muted:#7C8A93; --red:#E5120A;
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100dvh;display:flex;align-items:safe center;justify-content:center;
  font-family:"IBM Plex Mono",monospace;color:var(--ink);
  background:radial-gradient(ellipse 900px 480px at 50% -12%, rgba(147,160,168,.10), transparent 62%), var(--ground-2);
}

.scene{position:relative;width:100%;max-width:460px;margin:0 auto;padding:16px 14px 14px}

.panel-ticks{
  position:absolute;left:50%;top:-52px;width:520px;height:520px;transform:translateX(-50%);
  border-radius:50%;pointer-events:none;
  background:repeating-conic-gradient(from 0deg, rgba(174,186,193,.06) 0deg 1.1deg, transparent 1.1deg 6deg);
  -webkit-mask:radial-gradient(circle, #000 52%, transparent 76%);
          mask:radial-gradient(circle, #000 52%, transparent 76%);
}
.panel-beam{
  position:absolute;left:50%;top:-52px;width:520px;height:520px;transform:translateX(-50%);
  border-radius:50%;pointer-events:none;mix-blend-mode:screen;
  background:conic-gradient(from 0deg, rgba(229,18,10,.15), transparent 16deg 344deg, rgba(229,18,10,.15));
  animation:sweep 11s linear infinite;
}
@keyframes sweep{to{transform:translateX(-50%) rotate(360deg)}}

.brand{position:relative;text-align:center;margin:2px 0 14px}
.brand img{
  height:58px;width:auto;
  filter:drop-shadow(0 0 10px rgba(229,18,10,.4)) drop-shadow(0 0 22px rgba(229,18,10,.18));
}

.status-line{
  display:none;justify-content:center;gap:28px;margin:-6px 0 26px;
  font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
}

.grid{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:7px}

.tile{
  position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;
  padding:11px 6px 9px;text-decoration:none;color:inherit;border-radius:10px;
  background:linear-gradient(160deg, rgba(242,244,245,.05), rgba(242,244,245,0) 55%), var(--plate);
  border:1px solid var(--line-soft);
  opacity:0;transform:translateY(10px);animation:rise .55s cubic-bezier(.2,.7,.2,1) forwards;
  transition:border-color .2s ease, transform .15s ease;
}
.tile:hover{border-color:rgba(229,18,10,.5)}
.tile:active{transform:scale(.97)}
@keyframes rise{to{opacity:1;transform:translateY(0)}}
.tile:nth-child(1){animation-delay:.05s}
.tile:nth-child(2){animation-delay:.17s}
.tile:nth-child(3){animation-delay:.29s}
.tile:nth-child(4){animation-delay:.41s}
.tile:nth-child(5){animation-delay:.53s}
.tile:nth-child(6){animation-delay:.65s}

.gauge{position:relative;width:52px;height:52px}
.gauge .ticks{
  position:absolute;inset:0;border-radius:50%;
  background:repeating-conic-gradient(from 0deg, var(--line) 0deg 3deg, transparent 3deg 30deg);
  -webkit-mask:radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
          mask:radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
}
.gauge svg.arc{position:absolute;inset:5px}
.arc-bg{fill:none;stroke:var(--line-soft);stroke-width:4}
.arc-fg{
  fill:none;stroke:var(--red);stroke-width:4;
  filter:drop-shadow(0 0 4px rgba(229,18,10,.65));
  opacity:0;
  animation:ringin .5s ease forwards, breathe 3.6s ease-in-out .5s infinite;
}
@keyframes ringin{to{opacity:1}}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.72}}

.icon{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--ink-2);transition:color .2s ease}
.icon svg{width:19px;height:19px}
.tile:hover .icon{color:var(--red)}

.name{
  font-family:"Saira Condensed",sans-serif;font-weight:500;font-size:13.5px;letter-spacing:.04em;
  text-transform:uppercase;text-align:center;color:var(--ink);
}

.nameplate{
  position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;
  margin-top:10px;padding:12px 10px;text-decoration:none;border-radius:8px;
  background:linear-gradient(160deg, rgba(242,244,245,.04), transparent 60%), var(--plate);
  border:1px solid var(--line-soft);
  opacity:0;transform:translateY(8px);animation:rise .6s ease .8s forwards;
}
.rivet{position:absolute;width:5px;height:5px;border-radius:50%;background:var(--line);box-shadow:inset 0 1px 1px rgba(0,0,0,.6)}
.rivet.tl{top:8px;left:8px}.rivet.tr{top:8px;right:8px}.rivet.bl{bottom:8px;left:8px}.rivet.br{bottom:8px;right:8px}
.np-cta{font-weight:500;font-size:11.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--red);text-shadow:0 0 12px rgba(229,18,10,.4);animation:pulse 2.2s ease-in-out infinite}
.np-sub{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

@media (min-width:860px){
  .scene{max-width:980px;padding:40px 48px 48px}
  .panel-ticks,.panel-beam{width:820px;height:820px;top:-96px}
  .status-line{display:flex}
  .brand img{height:78px}
  .grid{grid-template-columns:repeat(3,1fr);gap:20px}
  .tile{padding:30px 18px 26px;border-radius:12px}
  .tile:hover{transform:translateY(-3px)}
  .gauge{width:88px;height:88px}
  .icon svg{width:32px;height:32px}
  .name{font-size:16px;letter-spacing:.06em}
  .nameplate{flex-direction:row;justify-content:center;gap:22px;margin-top:30px;padding:20px 26px}
  .np-sub{font-size:10.5px}
}

@media (prefers-reduced-motion:reduce){
  .tile,.nameplate{animation:none!important;opacity:1!important;transform:none!important}
  .arc-fg{animation:none!important;opacity:1!important}
  .panel-beam{animation:none!important}
  .np-cta{animation:none!important}
}
</style>

<script>
if (window.matchMedia('(min-width:860px)').matches &&
    window.matchMedia('(pointer:fine)').matches &&
    !window.matchMedia('(prefers-reduced-motion:reduce)').matches) {
  document.querySelectorAll('.tile').forEach(function(t){
    t.addEventListener('mousemove', function(e){
      var r = t.getBoundingClientRect();
      var x = (e.clientX - r.left) / r.width - 0.5;
      var y = (e.clientY - r.top) / r.height - 0.5;
      t.style.transform = 'perspective(700px) rotateX(' + (-y*7).toFixed(2) + 'deg) rotateY(' + (x*7).toFixed(2) + 'deg) translateY(-3px)';
    });
    t.addEventListener('mouseleave', function(){ t.style.transform = ''; });
  });
}
</script>
